<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images → MOV — Tools</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A5%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--fg:#1a1a1a;--fg-muted:#666;--bg:#fafafa;--surface:#fff;--border:#e0e0e0;--accent:#0066ff;--success:#007a33;--error:#d92b2b;--muted:#f5f5f5}
        [data-theme="dark"]{--fg:#f0f0f0;--fg-muted:#999;--bg:#121212;--surface:#1e1e1e;--border:#333;--accent:#4d94ff;--success:#4ade80;--error:#ff6b6b;--muted:#2a2a2a}
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
        .nav{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:100;padding:0.75rem 1.5rem}
        main{max-width:800px;margin:0 auto;padding:5rem 1.5rem 4rem}
        .hero{text-align:center;margin-bottom:2rem}.hero h1{font-size:2.5rem;font-weight:800}.hero p{color:var(--fg-muted)}
        .section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
        .section h2{font-size:1.1rem;font-weight:600;margin-bottom:1rem}
        .upload-zone{border:2px dashed var(--border);border-radius:8px;padding:2rem;text-align:center;cursor:pointer}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
        .image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:0.5rem;margin-top:1rem}
        .image-thumb{position:relative;border-radius:6px;overflow:hidden}.image-thumb img{width:100%;aspect-ratio:1;object-fit:cover}
        .image-thumb .x{position:absolute;top:2px;right:2px;background:var(--error);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer}
        .control-group{margin-bottom:1rem}.control-group label{display:block;font-size:0.85rem;font-weight:500;margin-bottom:0.25rem}
        .control-group select,.control-group input{width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg)}
        .btn{display:inline-flex;padding:0.75rem 1.5rem;font-size:0.95rem;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:var(--accent);color:#fff}
        .btn:disabled{opacity:0.5}
        .status{padding:0.75rem;border-radius:8px;margin-top:1rem;display:none}.status.visible{display:block}
        .output-section{display:none}.output-section.visible{display:block}
        footer{text-align:center;padding:2rem;color:var(--fg-muted);border-top:1px solid var(--border)}
        @media(max-width:768px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<nav style="position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0.75rem 1.5rem;z-index:100">
    <a href="landing.html" style="font-weight:700;text-decoration:none;color:var(--fg)">← Digital Twin</a>
</nav>
<main>
    <header class="hero"><h1>🖼️ Images → MOV</h1><p>Convert image sequences to looping video with Ken Burns effects</p></header>
    <div class="grid">
        <div>
            <section class="section"><h2>1. Upload Images</h2>
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
                    <div style="font-size:2rem">📁</div><div><strong>Click to upload</strong><br>PNG, JPG, WebP</div>
                </div>
                <div class="image-grid" id="imageGrid"></div>
            </section>
            <section class="section"><h2>2. Settings</h2>
                <div class="control-group"><label>Length</label><select id="length"><option value="3">3 sec</option><option value="5" selected>5 sec</option><option value="10">10 sec</option></select></div>
                <div class="control-group"><label>Frame Rate</label><select id="fps"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select></div>
                <div class="control-group"><label>Ken Burns</label><select id="kenBurns"><option value="none">None</option><option value="zoom-in" selected>Zoom In</option><option value="zoom-out">Zoom Out</option><option value="pan-left">Pan Left</option></select></div>
                <div class="control-group"><label>Fade In (s)</label><input type="number" id="fadeIn" value="0.5" min="0" max="5" step="0.1"></div>
            </section>
        </div>
        <div>
            <section class="section"><h2>3. Export</h2>
                <button class="btn" id="generateBtn" disabled onclick="generate()">🎬 Generate MOV</button>
                <div class="status" id="status"></div>
            </section>
            <section class="section output-section" id="result"><h2>Result</h2>
                <video id="outputVideo" controls style="width:100%"></video>
                <div style="margin-top:1rem"><a class="btn" id="downloadLink" download="video.mov">⬇️ Download</a></div>
            </section>
            <section class="section"><h2>CLI</h2><pre><code>python3 lib/images-to-mov.py "*.png" out.mov</code></pre></section>
        </div>
    </div>
</main>
<footer><p>Built with FFmpeg • Digital Twin</p></footer>
<script>let images=[];
function handleFiles(files){Array.from(files).forEach(f=>{images.push({file:f,url:URL.createObjectURL(f)})});render()}
function render(){document.getElementById('imageGrid').innerHTML=images.map((img,i)=>`<div class="image-thumb"><img src="${img.url}"><button class="x" onclick="images.splice(${i},1);render()">×</button></div>`).join('');document.getElementById('generateBtn').disabled=images.length===0}
async function generate(){const s=document.getElementById('status');s.className='status visible';s.textContent='⏳ Processing...';document.getElementById('generateBtn').disabled=true;const fd=new FormData();images.forEach((img,i)=>fd.append('image_'+i,img.file));fd.append('frameDuration',document.getElementById('length').value/images.length);fd.append('frameRate',document.getElementById('fps').value);fd.append('kenBurns',document.getElementById('kenBurns').value);fd.append('fadeIn',document.getElementById('fadeIn').value);try{const r=await fetch('/api/images-to-mov',{method:'POST',body:fd});if(!r.ok)throw new Error;const b=await r.blob();document.getElementById('outputVideo').src=URL.createObjectURL(b);document.getElementById('downloadLink').href=document.getElementById('outputVideo').src;document.getElementById('result').classList.add('visible');s.className='status visible';s.textContent='✅ Done!'}catch(e){s.className='status visible';s.textContent='❌ Error'}document.getElementById('generateBtn').disabled=false}</script>
</body>
</html>
