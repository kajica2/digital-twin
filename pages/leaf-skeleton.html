<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaf Skeleton — Botanical Vector Study</title>
  <style>
    :root {
      --ink-black: #0a0a0a;
      --paper-white: #fefefe;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--paper-white);
      padding: 20px;
    }

    .frame {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: var(--paper-white);
      border: 8px solid var(--ink-black);
      box-shadow: 
        0 0 0 2px var(--paper-white),
        0 0 0 10px var(--ink-black),
        12px 12px 0 var(--ink-black);
    }

    .canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Title */
    .title {
      margin-top: 30px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--ink-black);
    }

    .subtitle {
      margin-top: 8px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      color: #444;
    }

    /* SVG Styles */
    .main-vein {
      stroke: var(--ink-black);
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }

    .secondary-vein {
      stroke: var(--ink-black);
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }

    .tertiary-vein {
      stroke: var(--ink-black);
      stroke-width: 0.7;
      stroke-linecap: round;
      fill: none;
    }

    .capillary {
      stroke: var(--ink-black);
      stroke-width: 0.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.7;
    }

    .stipple {
      fill: var(--ink-black);
    }

    .cell-outline {
      stroke: var(--ink-black);
      stroke-width: 0.2;
      fill: none;
      opacity: 0.4;
    }

    /* Animation */
    @keyframes drawIn {
      from { stroke-dashoffset: 2000; }
      to { stroke-dashoffset: 0; }
    }

    .vein-animate {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: drawIn 3s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="canvas">
      <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Stipple pattern -->
          <pattern id="stipplePattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.3" fill="#0a0a0a" opacity="0.6"/>
            <circle cx="6" cy="6" r="0.2" fill="#0a0a0a" opacity="0.4"/>
          </pattern>
          
          <!-- Fine mesh pattern -->
          <pattern id="meshPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
            <path d="M0 6 Q3 3 6 6 T12 6" stroke="#0a0a0a" stroke-width="0.15" fill="none" opacity="0.3"/>
            <path d="M6 0 Q3 3 6 6 T6 12" stroke="#0a0a0a" stroke-width="0.15" fill="none" opacity="0.3"/>
          </pattern>
        </defs>

        <!-- Background with subtle texture -->
        <rect width="800" height="800" fill="#fefefe"/>
        <rect width="800" height="800" fill="url(#stipplePattern)" opacity="0.3"/>

        <!-- Main Diagonal Vein (Primary) - runs from bottom-left to top-right -->
        <path class="main-vein vein-animate" d="M120 680 Q250 580 380 450 Q500 330 650 180" style="animation-delay: 0s;"/>
        
        <!-- Secondary veins branching from main -->
        <path class="secondary-vein vein-animate" d="M180 600 Q220 540 200 480" style="animation-delay: 0.3s;"/>
        <path class="secondary-vein vein-animate" d="M280 520 Q340 480 360 420" style="animation-delay: 0.4s;"/>
        <path class="secondary-vein vein-animate" d="M380 440 Q420 380 480 340" style="animation-delay: 0.5s;"/>
        <path class="secondary-vein vein-animate" d="M480 360 Q540 300 600 260" style="animation-delay: 0.6s;"/>
        <path class="secondary-vein vein-animate" d="M580 280 Q620 220 680 180" style="animation-delay: 0.7s;"/>
        
        <!-- Opposite side secondary veins -->
        <path class="secondary-vein vein-animate" d="M200 640 Q280 620 320 560" style="animation-delay: 0.35s;"/>
        <path class="secondary-vein vein-animate" d="M320 540 Q400 520 440 460" style="animation-delay: 0.45s;"/>
        <path class="secondary-vein vein-animate" d="M440 440 Q520 420 560 360" style="animation-delay: 0.55s;"/>
        <path class="secondary-vein vein-animate" d="M560 340 Q620 300 660 240" style="animation-delay: 0.65s;"/>

        <!-- Tertiary branching network -->
        <g class="tertiary-vein" style="animation-delay: 0.8s;">
          <!-- Upper network -->
          <path d="M200 480 Q180 440 220 400"/>
          <path d="M220 400 Q260 360 240 320"/>
          <path d="M240 320 Q280 280 320 260"/>
          <path d="M200 480 Q160 440 140 400"/>
          <path d="M140 400 Q120 360 160 320"/>
          <path d="M160 320 Q140 280 180 240"/>
          
          <!-- Middle network -->
          <path d="M360 420 Q340 380 380 340"/>
          <path d="M380 340 Q420 300 400 260"/>
          <path d="M400 260 Q440 220 480 200"/>
          <path d="M360 420 Q320 380 300 340"/>
          <path d="M300 340 Q260 300 280 260"/>
          
          <!-- Lower network -->
          <path d="M480 340 Q460 300 500 260"/>
          <path d="M500 260 Q540 220 520 180"/>
          <path d="M520 180 Q560 140 600 120"/>
          <path d="M480 340 Q440 300 420 260"/>
          <path d="M420 260 Q380 220 400 180"/>
          
          <!-- Branch extensions -->
          <path d="M240 320 Q200 300 220 260"/>
          <path d="M320 260 Q360 220 340 180"/>
          <path d="M400 200 Q440 160 420 120"/>
          <path d="M520 180 Q560 140 540 100"/>
        </g>

        <!-- Capillary network - intricate fine lines -->
        <g class="capillary">
          <!-- Dense capillary mesh upper left -->
          <path d="M140 400 Q130 380 150 360"/>
          <path d="M150 360 Q140 340 160 320"/>
          <path d="M160 320 Q150 300 170 280"/>
          <path d="M180 240 Q160 220 190 200"/>
          <path d="M190 200 Q170 180 200 160"/>
          
          <!-- Capillaries from tertiary branches -->
          <path d="M220 400 Q210 380 230 360"/>
          <path d="M230 360 Q220 340 250 320"/>
          <path d="M240 320 Q230 300 260 280"/>
          <path d="M280 260 Q270 240 290 220"/>
          <path d="M320 260 Q310 240 330 220"/>
          
          <!-- Middle section capillaries -->
          <path d="M300 340 Q290 320 310 300"/>
          <path d="M310 300 Q300 280 320 260"/>
          <path d="M380 340 Q370 320 390 300"/>
          <path d="M390 300 Q380 280 400 260"/>
          <path d="M400 260 Q390 240 410 220"/>
          
          <!-- Lower section capillaries -->
          <path d="M420 260 Q410 240 430 220"/>
          <path d="M430 220 Q420 200 440 180"/>
          <path d="M500 260 Q490 240 510 220"/>
          <path d="M510 220 Q500 200 520 180"/>
          <path d="M520 180 Q510 160 530 140"/>
          
          <!-- Right side capillaries -->
          <path d="M600 260 Q590 240 610 220"/>
          <path d="M620 220 Q610 200 630 180"/>
          <path d="M640 180 Q630 160 650 140"/>
          <path d="M660 140 Q650 120 670 100"/>
        </g>

        <!-- Cell network - microscopic detail -->
        <g class="cell-outline">
          <!-- Upper left cell group -->
          <path d="M130 420 L150 410 L140 390 L120 400 Z"/>
          <path d="M150 410 L170 400 L160 380 L140 390 Z"/>
          <path d="M120 400 L140 390 L130 370 L110 380 Z"/>
          <path d="M170 400 L190 390 L180 370 L160 380 Z"/>
          
          <!-- Cell patches scattered throughout -->
          <path d="M190 370 L210 360 L200 340 L180 350 Z"/>
          <path d="M210 360 L230 350 L220 330 L200 340 Z"/>
          <path d="M250 350 L270 340 L260 320 L240 330 Z"/>
          <path d="M270 340 L290 330 L280 310 L260 320 Z"/>
          
          <!-- Middle cells -->
          <path d="M330 310 L350 300 L340 280 L320 290 Z"/>
          <path d="M350 300 L370 290 L360 270 L340 280 Z"/>
          <path d="M370 290 L390 280 L380 260 L360 270 Z"/>
          <path d="M390 280 L410 270 L400 250 L380 260 Z"/>
          
          <!-- Lower middle -->
          <path d="M410 250 L430 240 L420 220 L400 230 Z"/>
          <path d="M430 240 L450 230 L440 210 L420 220 Z"/>
          <path d="M450 230 L470 220 L460 200 L440 210 Z"/>
          <path d="M470 220 L490 210 L480 190 L460 200 Z"/>
          
          <!-- Right side cells -->
          <path d="M510 200 L530 190 L520 170 L500 180 Z"/>
          <path d="M530 190 L550 180 L540 160 L520 170 Z"/>
          <path d="M550 180 L570 170 L560 150 L540 160 Z"/>
          <path d="M570 170 L590 160 L580 140 L560 150 Z"/>
          <path d="M610 150 L630 140 L620 120 L600 130 Z"/>
        </g>

        <!-- Stippled dots accent -->
        <g class="stipple">
          <!-- Scattered stippling near veins -->
          <circle cx="195" cy="455" r="0.8"/><circle cx="205" cy="445" r="0.6"/>
          <circle cx="185" cy="465" r="0.7"/><circle cx="215" cy="435" r="0.5"/>
          <circle cx="175" cy="475" r="0.6"/><circle cx="225" cy="425" r="0.7"/>
          
          <circle cx="295" cy="375" r="0.8"/><circle cx="305" cy="365" r="0.6"/>
          <circle cx="285" cy="385" r="0.7"/><circle cx="315" cy="355" r="0.5"/>
          
          <circle cx="395" cy="295" r="0.8"/><circle cx="405" cy="285" r="0.6"/>
          <circle cx="385" cy="305" r="0.7"/><circle cx="415" cy="275" r="0.5"/>
          
          <circle cx="495" cy="215" r="0.8"/><circle cx="505" cy="205" r="0.6"/>
          <circle cx="485" cy="225" r="0.7"/><circle cx="515" cy="195" r="0.5"/>
          
          <circle cx="595" cy="145" r="0.8"/><circle cx="605" cy="135" r="0.6"/>
          <circle cx="585" cy="155" r="0.7"/><circle cx="615" cy="125" r="0.5"/>
          
          <!-- Stippling along main vein -->
          <circle cx="250" cy="550" r="0.6"/><circle cx="270" cy="530" r="0.7"/>
          <circle cx="350" cy="450" r="0.5"/><circle cx="370" cy="430" r="0.6"/>
          <circle cx="450" cy="370" r="0.7"/><circle cx="470" cy="350" r="0.5"/>
          <circle cx="550" cy="290" r="0.6"/><circle cx="570" cy="270" r="0.7"/>
          <circle cx="620" cy="210" r="0.5"/><circle cx="640" cy="190" r="0.6"/>
          
          <!-- Fine stipple clusters -->
          <circle cx="160" cy="340" r="0.4"/><circle cx="170" cy="330" r="0.3"/>
          <circle cx="180" cy="320" r="0.4"/><circle cx="190" cy="310" r="0.3"/>
          <circle cx="260" cy="280" r="0.4"/><circle cx="270" cy="270" r="0.3"/>
          <circle cx="360" cy="220" r="0.4"/><circle cx="370" cy="210" r="0.3"/>
          <circle cx="460" cy="170" r="0.4"/><circle cx="470" cy="160" r="0.3"/>
          <circle cx="560" cy="120" r="0.4"/><circle cx="570" cy="110" r="0.3"/>
          
          <!-- Additional scattered dots -->
          <circle cx="130" cy="350" r="0.5"/><circle cx="200" cy="280" r="0.4"/>
          <circle cx="300" cy="200" r="0.5"/><circle cx="400" cy="140" r="0.4"/>
          <circle cx="500" cy="90" r="0.5"/><circle cx="600" cy="60" r="0.4"/>
        </g>

        <!-- Heavy accent lines - outer frame suggestion -->
        <path d="M100 700 Q50 400 100 100" stroke="#0a0a0a" stroke-width="2" fill="none" opacity="0.3"/>
        <path d="M700 100 Q750 400 700 700" stroke="#0a0a0a" stroke-width="2" fill="none" opacity="0.3"/>
      </svg>
    </div>
  </div>
  <div class="title">Leaf Skeleton</div>
  <div class="subtitle">Botanical Vector Study No. 7</div>
</body>
</html>
