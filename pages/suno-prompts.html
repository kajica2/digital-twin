let selectedIdx = null;

function selectPreset(idx) {
    selectedIdx = idx;
    document.querySelectorAll('.preset-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
    });
    document.getElementById('output').textContent = PRESETS[idx].prompt;
}

function copyPrompt() {
    if (selectedIdx === null) return alert('Select a preset first');
    navigator.clipboard.writeText(PRESETS[selectedIdx].prompt);
    showToast('Copied!');
}

function emailPrompt() {
    if (selectedIdx === null) return alert('Select a preset first');
    const email = 'kai.djuric@gmail.com';
    const subject = encodeURIComponent('My Suno Reference Prompt: ' + PRESETS[selectedIdx].name);
    const body = encodeURIComponent(PRESETS[selectedIdx].prompt);
    window.location.href = 'mailto:' + email + '?subject=' + subject + '&body=' + body;
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:0.75rem 1.5rem;border-radius:var(--radius-md);font-weight:600;z-index:1000';
