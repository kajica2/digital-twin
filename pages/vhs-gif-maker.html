<!DOCTYPE html>
<html lang="en" data-theme="system" data-variant="1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📼 VHS GIF Maker — Digital Twin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,4 28,11 28,21 16,28 4,21 4,11' fill='none' stroke='%23c97b3f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c97b3f'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        :root{--bg:#f7f5f0;--surface:#fff;--line:#e9e3d6;--ink:#14171e;--ink-muted:#3a4256;--primary:#c97b3f;--accent:#2f6f5e;--space-2:8px;--space-4:16px;--space-5:24px;--radius-md:10px;--radius-lg:14px;--font-body:'Outfit',sans-serif;--font-display:'DM Serif Display',serif}
        [data-theme="dark"]{--bg:#1a1812;--surface:#25221a;--line:#3a342a;--ink:#f4efe2;--ink-muted:#c0b8a8;--primary:#d9925a;--accent:#6ab098}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.5}
        .header{background:linear-gradient(135deg,var(--primary),#a85f28);padding:1.5rem 2rem;color:#fff}
        .header-content{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo{font-family:var(--font-display);font-size:1.5rem}
        main{max-width:800px;margin:0 auto;padding:var(--space-5)}
        .card{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-5);border:1px solid var(--line)}
        .card-title{font-weight:700;font-size:1.1rem;margin-bottom:var(--space-4);font-family:var(--font-display)}
        .upload-zone{border:2px dashed var(--line);border-radius:var(--radius-lg);padding:2rem;text-align:center;cursor:pointer;transition:border-color 0.2s}
        .upload-zone:hover{border-color:var(--primary)}
        .preview video{max-width:100%;border-radius:var(--radius-md);margin-top:var(--space-4);display:none}
        .preview video.visible{display:block}
        .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-4);margin-top:var(--space-4)}
        .control-group label{display:block;font-size:0.85rem;font-weight:500;margin-bottom:4px}
        .control-group input[type=range]{width:100%}
        .control-value{font-size:0.8rem;color:var(--ink-muted)}
        .btn{display:inline-flex;padding:0.75rem 1.5rem;font-size:0.9rem;font-weight:600;border:none;border-radius:var(--radius-md);cursor:pointer;background:var(--primary);color:#fff;transition:opacity 0.2s}
        .btn:disabled{opacity:0.5;cursor:not-allowed}
        .btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
        .output{display:none;margin-top:var(--space-4)}
        .output.visible{display:block}
        .output img{max-width:100%;border-radius:var(--radius-md)}
        .status{padding:0.75rem;border-radius:var(--radius-md);margin-top:var(--space-4);display:none}
        .status.visible{display:block}
        .status.processing{background:rgba(201,123,63,0.1);color:var(--primary)}
        .status.success{background:rgba(47,111,94,0.1);color:var(--accent)}
        .status.error{background:rgba(239,68,68,0.1);color:#d92b2b}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">📼 VHS GIF Maker</div>
            <a href="landing.html" style="color:#fff;text-decoration:none">← Tools</a>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="card-title">1. Upload Video</div>
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="video/*" style="display:none" onchange="handleFile(this.files[0])">
                <div style="font-size:2rem">🎬</div>
                <div>Click to upload • MP4, MOV, WebM</div>
            </div>
            <div class="preview"><video id="previewVideo" controls></video></div>
        </div>
        <div class="card">
            <div class="card-title">2. VHS Effects</div>
            <div class="controls">
                <div class="control-group">
                    <label>Noise</label>
                    <input type="range" id="noise" min="0" max="100" value="30" oninput="this.nextElementSibling.textContent=this.value+'%'">
                    <span class="control-value">30%</span>
                </div>
                <div class="control-group">
                    <label>Scanlines</label>
                    <input type="range" id="scanlines" min="0" max="100" value="40" oninput="this.nextElementSibling.textContent=this.value+'%'">
                    <span class="control-value">40%</span>
                </div>
                <div class="control-group">
                    <label>RGB Shift</label>
                    <input type="range" id="rgb" min="0" max="50" value="5" oninput="this.nextElementSibling.textContent=this.value+'px'">
                    <span class="control-value">5px</span>
                </div>
                <div class="control-group">
                    <label>Tracking</label>
                    <input type="range" id="tracking" min="0" max="100" value="20" oninput="this.nextElementSibling.textContent=this.value+'%'">
                    <span class="control-value">20%</span>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">3. Export</div>
            <p style="color:var(--ink-muted);margin-bottom:1rem">Output: 5s loop, 480px, GIF</p>
            <button class="btn" id="generateBtn" disabled onclick="generateGif()">✨ Generate</button>
            <div class="status" id="status"></div>
            <div style="margin-top:1rem">
                <input type="text" id="apiUrl" placeholder="https://api.example.com/webhook (optional)" style="width:100%;padding:0.75rem;border:1px solid var(--line);border-radius:var(--radius-md)">
                <button class="btn btn-secondary" style="margin-top:0.5rem" onclick="runApi()">🔌 API</button>
            </div>
        </div>
        <div class="card output" id="result">
            <div class="card-title">Your GIF</div>
            <img id="outputGif">
            <div style="margin-top:1rem;display:flex;gap:0.5rem">
                <a class="btn" id="downloadLink" download="vhs.gif">⬇️ Download</a>
                <button class="btn btn-secondary" onclick="location.reload()">🔄 New</button>
            </div>
        </div>
    </main>
<script>
let file = null;
function handleFile(f) {
    if (!f) return;
    file = f;
    const video = document.getElementById('previewVideo');
    video.src = URL.createObjectURL(f);
    video.style.display = 'block';
    document.getElementById('generateBtn').disabled = false;
}
async function generateGif() {
    if (!file) return alert('Upload a video first');
    const status = document.getElementById('status');
    const btn = document.getElementById('generateBtn');
    status.className = 'status visible processing';
    status.textContent = '⏳ Loading video...';
    btn.disabled = true;
    try {
        const video = document.getElementById('previewVideo');
        video.currentTime = 0;
        await new Promise((resolve, reject) => {
            video.onloadedmetadata = resolve;
            video.onerror = reject;
            setTimeout(() => reject(new Error('Video load timeout')), 10000);
        });
        if (!video.videoWidth) throw new Error('Cannot read video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const w = 480;
        const h = Math.round(480 * video.videoHeight / video.videoWidth);
        canvas.width = w;
        canvas.height = h;
        const gif = new GIF({ workers: 2, quality: 10, width: w, height: h, workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js' });
        gif.on('finished', function(blob) {
            document.getElementById('outputGif').src = URL.createObjectURL(blob);
            document.getElementById('downloadLink').href = document.getElementById('outputGif').src;
            document.getElementById('result').classList.add('visible');
            status.className = 'status visible success';
            status.textContent = '✅ Done!';
            btn.disabled = false;
        });
        gif.on('error', function(e) {
            status.className = 'status visible error';
            status.textContent = '❌ GIF Error: ' + e.message;
            btn.disabled = false;
        });
        const duration = 5, fps = 10, frames = Math.min(duration * fps, 50);
        let frame = 0;
        const processFrame = function() {
            if (frame >= frames) {
                status.textContent = '💾 Encoding...';
                gif.render();
                return;
            }
            video.currentTime = frame * video.duration / frames || 0;
            ctx.drawImage(video, 0, 0, w, h);
            applyVHS(ctx, w, h);
            gif.addFrame(ctx, { copy: true, delay: 1000 / fps });
            frame++;
            status.textContent = `⏳ Frame ${frame}/${frames}`;
            setTimeout(processFrame, 50);
        };
        video.currentTime = 0;
        video.pause();
        processFrame();
    } catch (e) {
        status.className = 'status visible error';
        status.textContent = '❌ Error: ' + e.message;
        btn.disabled = false;
    }
}
function applyVHS(ctx, w, h) {
    const noise = parseInt(document.getElementById('noise').value) / 100;
    const scanlines = parseInt(document.getElementById('scanlines').value) / 100;
    const rgb = parseInt(document.getElementById('rgb').value);
    const tracking = parseInt(document.getElementById('tracking').value) / 100;
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    if (rgb > 0) {
        for (let i = 0; i < data.length; i += 4) {
            if (Math.random() < 0.1) {
                data[i] = data[i + 4] || data[i];
                data[i + 2] = data[i - 4] || data[i + 2];
            }
        }
    }
    if (noise > 0) {
        for (let i = 0; i < data.length; i += 4) {
            const n = (Math.random() - 0.5) * noise * 80;
            data[i] += n; data[i + 1] += n; data[i + 2] += n;
        }
    }
    ctx.putImageData(imgData, 0, 0);
    if (scanlines > 0) {
        ctx.fillStyle = `rgba(0,0,0,${scanlines * 0.3})`;
        for (let y = 0; y < h; y += 2) ctx.fillRect(0, y, w, 1);
    }
    if (tracking > 0 && Math.random() < tracking) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(0, Math.random() * h, w, Math.random() * 10 + 5);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(w / 2, h / 2, w * 0.7, h * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
}
function runApi() {
    const apiUrl = document.getElementById('apiUrl').value.trim();
    if (!apiUrl) return alert('Enter API URL');
    if (!file) return alert('Upload a video first');
    const status = document.getElementById('status');
    status.className = 'status visible processing';
    status.textContent = '⏳ Sending to API...';
    const fd = new FormData();
    fd.append('video', file);
    fd.append('noise', document.getElementById('noise').value);
    fd.append('scanlines', document.getElementById('scanlines').value);
    fd.append('rgb', document.getElementById('rgb').value);
    fd.append('tracking', document.getElementById('tracking').value);
    fetch(apiUrl, { method: 'POST', body: fd })
        .then(r => { status.className = 'status visible success'; status.textContent = '✅ Sent to API!'; })
        .catch(e => { status.className = 'status visible error'; status.textContent = '❌ Error: ' + e.message; });
}
</script>
</body>
</html>
