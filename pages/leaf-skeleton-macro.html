<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaf Skeleton → City Evolution</title>
  <style>
    :root {
      --ink-black: #0a0a0a;
      --paper-white: #fafafa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      padding: 20px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 900px;
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--paper-white);
      overflow: hidden;
      border: 4px solid var(--ink-black);
    }

    .canvas {
      position: absolute;
      inset: 0;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Animation frames */
    .frame-1, .frame-2, .frame-3, .frame-4, .frame-5, .frame-6,
    .frame-7, .frame-8, .frame-9, .frame-10, .frame-11, .frame-12 {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .frame-1 { opacity: 1; }

    .active {
      opacity: 1;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      background: var(--paper-white);
      border: 2px solid var(--ink-black);
      color: var(--ink-black);
      padding: 10px 20px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--ink-black);
      color: var(--paper-white);
    }

    .progress {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border: 2px solid var(--paper-white);
      border-radius: 0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dot.active {
      background: var(--paper-white);
    }

    .label {
      color: var(--paper-white);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 15px;
    }

    .frame-label {
      color: #888;
      font-size: 10px;
      margin-top: 5px;
    }
  </style>
</head>

  <script>
    const frameLabels = [
      { title: "Leaf Skeleton", sub: "Natural origin" },
      { title: "Veins → Streets", sub: "Structure emerging" },
      { title: "First Foundations", sub: "Architecture forming" },
      { title: "City Emerges", sub: "Urban growth begins" },
      { title: "Growing City", sub: "Buildings multiply" },
      { title: "Industrial Age", sub: "Dense development" },
      { title: "Urban Density", sub: "Metropolitan form" },
      { title: "Modern City", sub: "Glass towers rise" },
      { title: "Contemporary", sub: "Contemporary architecture" },
      { title: "Futuristic", sub: "Tomorrow's skyline" },
      { title: "Neo-City", sub: "Monumental scale" },
      { title: "Night Metropolis", sub: "The modern city" }
    ];

    let currentFrame = 1;
    const totalFrames = 12;

    function showFrame(n) {
      if (n < 1) n = totalFrames;
      if (n > totalFrames) n = 1;
      
      document.querySelectorAll('.canvas').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dot').forEach(el => el.classList.remove('active'));
      
      document.querySelector(`.frame-${n}`).classList.add('active');
      document.querySelector(`.dot[data-frame="${n}"]`).classList.add('active');
      
      document.getElementById('titleText').textContent = frameLabels[n-1].title;
      document.getElementById('frameLabel').textContent = `Frame ${n} of 12 — ${frameLabels[n-1].sub}`;
      
      currentFrame = n;
    }

    document.getElementById('prevBtn').addEventListener('click', () => showFrame(currentFrame - 1));
    document.getElementById('nextBtn').addEventListener('click', () => showFrame(currentFrame + 1));

    document.querySelectorAll('.dot').forEach(dot => {
      dot.addEventListener('click', () => showFrame(parseInt(dot.dataset.frame)));
    });

    // Auto-advance
    let autoPlay = false;
    let autoInterval;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') showFrame(currentFrame + 1);
      if (e.key === 'ArrowLeft') showFrame(currentFrame - 1);
      if (e.key === ' ') {
        e.preventDefault();
        autoPlay = !autoPlay;
        if (autoPlay) {
          autoInterval = setInterval(() => showFrame(currentFrame + 1), 2500);
        } else {
          clearInterval(autoInterval);
        }
      }
    });
  </script>
