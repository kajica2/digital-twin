<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖼️ Images → MOV — Digital Twin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A5%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#f7f5f0;--surface:#fff;--line:#e9e3d6;--ink:#14171e;--ink-muted:#3a4256;--primary:#c97b3f;--accent:#2f6f5e;--space-2:8px;--space-4:16px;--space-5:24px;--radius-md:10px;--radius-lg:14px;--font-body:'Outfit',sans-serif;--font-display:'DM Serif Display',serif}
        [data-theme="dark"]{--bg:#1a1812;--surface:#25221a;--line:#3a342a;--ink:#f4efe2;--ink-muted:#c0b8a8;--primary:#d9925a;--accent:#6ab098}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.5}
        .header{background:linear-gradient(135deg,var(--primary),#a85f28);padding:1.5rem 2rem;color:#fff}
        .header-content{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo{font-family:var(--font-display);font-size:1.5rem}
        main{max-width:1000px;margin:0 auto;padding:var(--space-5)}
        .card{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-5);border:1px solid var(--line)}
        .card-title{font-weight:700;font-size:1.1rem;margin-bottom:var(--space-4);font-family:var(--font-display)}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}
        .upload-zone{border:2px dashed var(--line);border-radius:var(--radius-lg);padding:2rem;text-align:center;cursor:pointer;transition:border-color 0.2s}
        .upload-zone:hover{border-color:var(--primary)}
        .image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:0.5rem;margin-top:var(--space-4)}
        .image-thumb{position:relative;border-radius:6px;overflow:hidden}
        .image-thumb img{width:100%;aspect-ratio:1;object-fit:cover}
        .image-thumb .x{position:absolute;top:2px;right:2px;background:#d92b2b;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:14px;line-height:1}
        .control-group{margin-bottom:1rem}
        .control-group label{display:block;font-size:0.85rem;font-weight:500;margin-bottom:0.25rem}
        .control-group select,.control-group input{width:100%;padding:0.5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
        .btn{display:inline-flex;padding:0.75rem 1.5rem;font-size:0.9rem;font-weight:600;border:none;border-radius:var(--radius-md);cursor:pointer;background:var(--primary);color:#fff;transition:opacity 0.2s}
        .btn:disabled{opacity:0.5;cursor:not-allowed}
        .btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
        .status{padding:0.75rem;border-radius:var(--radius-md);margin-top:var(--space-4);display:none}
        .status.visible{display:block}
        .status.processing{background:rgba(201,123,63,0.1);color:var(--primary)}
        .status.success{background:rgba(47,111,94,0.1);color:var(--accent)}
        .status.error{background:rgba(239,68,68,0.1);color:#d92b2b}
        .output{display:none;margin-top:var(--space-4)}
        .output.visible{display:block}
        .output video{width:100%;border-radius:var(--radius-md)}
        @media(max-width:768px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🖼️ Images → MOV</div>
            <a href="landing.html" style="color:#fff;text-decoration:none">← Tools</a>
        </div>
    </header>
    <main>
        <div class="grid">
            <div>
                <div class="card">
                    <div class="card-title">1. Upload Images</div>
                    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
                        <div style="font-size:2rem">📁</div>
                        <div>Click to upload • PNG, JPG, WebP</div>
                    </div>
                    <div class="image-grid" id="imageGrid"></div>
                </div>
                <div class="card">
                    <div class="card-title">2. Settings</div>
                    <div class="control-group">
                        <label>Length per image</label>
                        <select id="length">
                            <option value="2">2 sec</option>
                            <option value="3">3 sec</option>
                            <option value="5" selected>5 sec</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Frame Rate</label>
                        <select id="fps">
                            <option value="24">24 fps</option>
                            <option value="30" selected>30 fps</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Ken Burns Effect</label>
                        <select id="kenBurns">
                            <option value="none">None</option>
                            <option value="zoom-in" selected>Zoom In</option>
                            <option value="zoom-out">Zoom Out</option>
                            <option value="pan-left">Pan Left</option>
                        </select>
                    </div>
                </div>
            </div>
            <div>
                <div class="card">
                    <div class="card-title">3. Generate</div>
                    <button class="btn" id="generateBtn" disabled onclick="generate()">🎬 Generate Video</button>
                    <div class="status" id="status"></div>
                </div>
                <div class="card output" id="result">
                    <div class="card-title">Your Video</div>
                    <video id="outputVideo" controls></video>
                    <div style="margin-top:var(--space-4);display:flex;gap:0.5rem">
                        <a class="btn" id="downloadLink" download="video.mov">⬇️ Download</a>
                        <button class="btn btn-secondary" onclick="location.reload()">🔄 New</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">🔌 API Webhook</div>
                    <input type="text" id="apiUrl" placeholder="https://api.example.com/webhook" style="width:100%;padding:0.75rem;border:1px solid var(--line);border-radius:var(--radius-md)">
                    <button class="btn btn-secondary" style="margin-top:0.5rem" onclick="runApi()">📤 Send to API</button>
                </div>
            </div>
        </div>
    </main>
<script>
let images = [];
let ffmpeg = null;
let ffmpegLoading = null;

// The ffmpeg.wasm loader lives in ONE place for the whole repo:
//   pages/assets/ffmpeg-client.mjs
// It loads the vendored, sha256-pinned copy of @ffmpeg/ffmpeg from
// /vendor/ffmpeg — no CDN, no hand-rolled worker patching, no possibility of
// "FFmpeg is not defined" again.
//
// The old code in this page loaded the UMD bundle from unpkg and called
// `new FFmpegFFmpeg()` — a name that never existed in any build — so every
// render died with "FFmpegFFmpeg is not defined".
//
// The ffmpeg argument list is built by /lib/render/plan.mjs, the module the
// server set uses, so a browser render and a server render of the same images
// produce the same video.
let toolPromise = null;

function tool() {
    if (!toolPromise) {
        toolPromise = import('/pages/assets/ffmpeg-client.mjs');
    }
    return toolPromise;
}

function handleFiles(files) {
    Array.from(files).forEach(f => {
        images.push({ file: f, url: URL.createObjectURL(f) });
    });
    render();
}

function render() {
    document.getElementById('imageGrid').innerHTML = images.map((img, i) => 
        `<div class="image-thumb"><img src="${img.url}"><button class="x" onclick="images.splice(${i},1);render()">×</button></div>`
    ).join('');
    document.getElementById('generateBtn').disabled = images.length === 0;
}

async function generate() {
    if (images.length === 0) return alert('Upload images first');
    const status = document.getElementById('status');
    const btn = document.getElementById('generateBtn');
    status.className = 'status visible processing';
    status.textContent = '⏳ Loading FFmpeg...';
    btn.disabled = true;

    try {
        const fps = parseInt(document.getElementById('fps').value);
        const duration = parseInt(document.getElementById('length').value);
        const kenBurns = document.getElementById('kenBurns').value;

        // Output geometry follows the first image's aspect ratio (so portrait photos
        // do not get letterboxed into a landscape frame), long side capped at 1080.
        const { renderImagesToMp4, planGeometry, probeImageSize } = await tool();
        const first = await probeImageSize(images[0].file);
        const geo = planGeometry(first.width, first.height);
        const W = geo.width;
        const H = geo.height;

        status.textContent = '⏳ Uploading frames...';

        // The ffmpeg argument list (one looping input per image, Ken Burns per
        // still, concat at the end) comes from /lib/render/plan.mjs — the same
        // module the server set uses, so both sets render identically.
        //
        // The tool is "Images → MOV", so we mux a real QuickTime container
        // (ftyp brand "qt  "). MOV carries the same H.264 stream as MP4 and plays
        // everywhere.
        status.textContent = '⏳ Encoding video...';
        const bytes = await renderImagesToMp4({
            files: images.map(img => img.file),
            fps,
            duration,
            kenBurns,
            width: W,
            height: H,
            container: 'mov',
            onLog: (message) => {
                if (/(error|fail|invalid|unable|no such)/i.test(message)) console.warn('[ffmpeg]', message);
            },
        });

        const magic = String.fromCharCode(bytes[4], bytes[5], bytes[6], bytes[7]);
        if (magic !== 'ftyp') throw new Error(`ffmpeg output is not a MOV (got "${magic}" at offset 4)`);
        const brand = String.fromCharCode(bytes[8], bytes[9], bytes[10], bytes[11]);
        if (brand !== 'qt  ') throw new Error(`ffmpeg output is not a QuickTime MOV (brand "${brand}")`);

        const blob = new Blob([bytes], { type: 'video/quicktime' });
        const url = URL.createObjectURL(blob);
        document.getElementById('outputVideo').src = url;
        document.getElementById('downloadLink').href = url;
        document.getElementById('result').classList.add('visible');

        status.className = 'status visible success';
        status.textContent = `✅ Done! ${W}×${H} · ${(images.length * duration).toFixed(1)}s`;
        btn.disabled = false;
    } catch (e) {
        status.className = 'status visible error';
        status.textContent = '❌ Error: ' + e.message;
        btn.disabled = false;
    }
}

function runApi() {
    const apiUrl = document.getElementById('apiUrl').value.trim();
    if (!apiUrl) return alert('Enter API URL');
    if (images.length === 0) return alert('Upload images first');
    
    const status = document.getElementById('status');
    status.className = 'status visible processing';
    status.textContent = '⏳ Sending to API...';
    
    const fd = new FormData();
    images.forEach((img, i) => fd.append('image_' + i, img.file));
    fd.append('fps', document.getElementById('fps').value);
    fd.append('duration', document.getElementById('length').value);
    fd.append('kenBurns', document.getElementById('kenBurns').value);
    
    fetch(apiUrl, { method: 'POST', body: fd })
        .then(r => {
            status.className = 'status visible success';
            status.textContent = '✅ Sent to API!';
        })
        .catch(e => {
            status.className = 'status visible error';
            status.textContent = '❌ Error: ' + e.message;
        });
}
</script>
</body>
</html>
