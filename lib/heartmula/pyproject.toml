[project]
name = "heartmula-twin"
version = "0.1.0"
description = "HeartMuLa (the open-source Suno-like music model) as a twin tool — lyrics + tags in, a song out."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # The official library (Apache-2.0). It is not on PyPI, so the source
    # is declared below with the exact commit the twin was verified
    # against — a direct URL in the dependency list is not valid PEP 508
    # metadata for an editable build.
    "heartlib",
    "torch>=2.4",
    "huggingface-hub>=0.27",
    "soundfile>=0.12",
]

[tool.uv.sources]
heartlib = { git = "https://github.com/HeartMuLa/heartlib.git", rev = "5858ca8f1ffe58d62be7c007ea55f1033c5ca456" }

[project.scripts]
heartmula = "heartmula_twin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartmula_twin"]
