[project]
name = "clip-interrogator-app"
version = "0.1.0"
description = "Local CLIP Interrogator port for the digital-twin — image-to-prompt + image analysis (gradio UI + CLI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "gradio~=5.0",
    "clip-interrogator==0.6.0",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[project.scripts]
clip-interrogate = "clip_interrogator_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_interrogator_app"]