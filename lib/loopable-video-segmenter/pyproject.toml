[project]
name = "loopable-video-segmenter-app"
version = "0.1.0"
description = "Local Loopable Video Segmenter port for the digital-twin — split an MP4 into beat-aligned, mirror-loopable clips (gradio UI + CLI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "gradio~=5.0",
    "moviepy>=1.0.3,<2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26,<2",
]

[project.scripts]
lvs-segment = "loopable_video_segmenter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopable_video_segmenter"]