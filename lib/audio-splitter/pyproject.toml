[project]
name = "audio-splitter"
version = "0.1.0"
description = "Detect the tracks in a long recording and cut them apart — for the digital_twin."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
]

[project.scripts]
audio-split = "audio_splitter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_splitter"]
