name: pages-test

# Puppeteer deploy-test loop for digital_twin.
# Mirrors the AGENTS.md "Puppeteer deploy-test loop" memory rule:
# the deploy is NOT done until the e2e hits the live URL and passes.
#
# Flow:
#   1. push lands on main
#   2. Vercel deploys (vercel CLI, triggered via CI or manually)
#   3. this workflow polls Vercel until the deploy is live, then
#      verifies a served file's bytes match HEAD — the poll alone can
#      be satisfied by a STALE build (site answers 200 while the new
#      build is still in flight), which is how a deploy once went
#      green before its own content was live
#   4. installs puppeteer in e2e/
#   5. runs e2e specs with E2E_URL=https://digitaltwin-ebon.vercel.app
#   6. any failure fails the build → no green check, the deploy is
#      treated as not-done
#
# On PRs (no E2E_URL — Vercel doesn't deploy PRs), the
# e2e runs against the local server on :5180.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read
  deployments: read

jobs:
  e2e:
    name: Puppeteer deploy-test loop
    runs-on: ubuntu-latest
    # The wait step (up to 5 min) + the content-freshness check (up to
    # 20 min) + the e2e run (a few min) do not fit in 10 minutes. The
    # observed Vercel deploy latency for this repo was ~6 minutes and
    # ~13 minutes on the same day, so the freshness budget is generous
    # on purpose: a deploy that lands late must not be reported as a
    # test failure.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install e2e dependencies
        run: cd e2e && npm install

      - name: Wait for Vercel deploy (push only)
        if: github.event_name == 'push'
        run: |
          echo "Waiting for Vercel to deploy..."
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://digitaltwin-ebon.vercel.app/pages/landing.html" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Vercel is live (attempt $i)"
              break
            fi
            echo "  attempt $i: HTTP $status — retrying in 5s"
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::Vercel never came up after 5 minutes"
            exit 1
          fi

      - name: Verify deployed content matches HEAD (push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The wait step above only proves the site answers 200 — a
          # STALE build satisfies that while the new build is still in
          # flight. This step proves the NEW build is serving.
          #
          # A FIXED sentinel list was not enough. On 2026-10-21 the
          # sentinels (mj-config.json, house.css) both matched HEAD
          # while pages/mj-sheets.html was still the PREVIOUS build —
          # those two files had not changed in that commit, so they
          # proved nothing about the page the e2e was about to test.
          # The e2e then failed for a reason that had nothing to do
          # with the code under test.
          #
          # The sentinels are therefore the PAGES THE E2E WILL LOAD,
          # derived from the spec files themselves. That is the real
          # contract: if the page under test is stale, the e2e result
          # is meaningless, whatever the rest of the site looks like.
          # A spec that adds a page automatically adds a sentinel.
          #
          # Plus the shared assets every page loads (the skin, the
          # theme script) and the config that drives the MJ tooling.
          SENTINELS=$(grep -hoE '/pages/[A-Za-z0-9._/-]*\.html' \
            e2e/*.spec.mjs e2e/ct-*.mjs 2>/dev/null \
            | sed 's|^/||' | sort -u)
          SENTINELS="$SENTINELS assets/skins/house.css lib/theme.js lib/skin.js lib/mj-config.json"

          # Dedupe, drop anything Vercel does not serve (a sentinel
          # that can never match would fail the run forever), and
          # require the file to exist at HEAD.
          VERIFY=""
          for FILE in $(echo "$SENTINELS" | tr ' ' '\n' | awk 'NF' | sort -u); do
            git cat-file -e "HEAD:$FILE" 2>/dev/null || continue
            if git -c core.excludesFile=.vercelignore check-ignore --no-index -q "$FILE" 2>/dev/null; then
              continue
            fi
            VERIFY="$VERIFY $FILE"
          done
          if [ -z "$(echo "$VERIFY" | tr -d ' ')" ]; then
            echo "::error::no sentinels to verify — refusing to pass silently"
            exit 1
          fi
          echo "verifying $(echo "$VERIFY" | wc -w | tr -d ' ') sentinel(s) against the deploy"
          echo "sentinels: $(echo $VERIFY)"

          # ONE global deadline for the whole set, not a budget per
          # file. The deploy either lands or it does not, so the whole
          # set is re-checked against a single clock.
          #
          # 20 minutes, not 10: the observed deploy latency for this
          # repo was ~6 minutes on 2026-10-21 and ~13 minutes on the
          # same day (the store commit landed 13 minutes after the
          # push). A 10-minute budget failed the run for a deploy that
          # was simply still in flight — the gate was measuring the
          # build queue, not the code. The budget must clear the
          # worst observed latency, not the typical one.
          DEADLINE=$(( $(date +%s) + 1200 ))
          STALE=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STALE=""
            for FILE in $VERIFY; do
              git show "HEAD:$FILE" > /tmp/expected
              curl -s --max-time 10 -H "Cache-Control: no-cache" \
                "https://digitaltwin-ebon.vercel.app/$FILE?x=${GITHUB_SHA}" \
                > /tmp/served || true
              if ! cmp -s /tmp/expected /tmp/served; then
                STALE="$STALE $FILE"
              fi
            done
            if [ -z "$STALE" ]; then
              echo "deployed content matches HEAD (all sentinels)"
              exit 0
            fi
            echo "  attempt: still stale ->$STALE — retrying in 5s"
            sleep 5
          done
          echo "::error::deployed content still != HEAD after 20 minutes ->$STALE"
          exit 1

      - name: Run e2e (deployed URL on push, local on PR)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            cd e2e && E2E_URL=https://digitaltwin-ebon.vercel.app node landing.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node twin-os.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node twin-os-songs.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-default.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-icon.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-nav.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-progress.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-theme.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-verify.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-a11y.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node ct-phase3.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node clip-interrogator.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node refael.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node how-to.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node loopable-video-segmenter.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node marketplace.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node temple-of-control.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node floating-toolset.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node integrations.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node mj-dashboard.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node mj-sheets.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && E2E_URL=https://digitaltwin-ebon.vercel.app node skin.spec.mjs
          else
            echo "(PR run - Vercel doesn't deploy PRs, e2e runs locally)"
            node "$GITHUB_WORKSPACE/lib/serve.js" --port 5180 --host 127.0.0.1 &
            SERVER_PID=$!
            sleep 2
            cd e2e && node landing.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && node twin-os.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && node twin-os-songs.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-default.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-icon.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-nav.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-progress.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-theme.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-verify.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-a11y.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node ct-phase3.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node clip-interrogator.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node refael.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node how-to.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node loopable-video-segmenter.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node marketplace.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node temple-of-control.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node floating-toolset.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node integrations.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node mj-dashboard.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node mj-sheets.spec.mjs
            cd "$GITHUB_WORKSPACE/e2e" && PORT=5180 node skin.spec.mjs
            kill $SERVER_PID 2>/dev/null || true
          fi
          echo "(watcher specs are filesystem-only and require a live chart-watcher LaunchAgent + mscore, neither of which exists on Linux CI runners. Run locally via npm run test:watcher && npm run test:songs-watcher. The watcher.spec.mjs + songs-watcher.spec.mjs files exist in e2e/ for that purpose.)"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore